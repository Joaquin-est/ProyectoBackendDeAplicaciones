spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/patito}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/patito/protocol/openid-connect/certs}

  cloud:
    gateway:
      routes:
        - id: ms-clientes
          uri: http://ms-clientes:41074
          predicates:
            - Path=/api/clientes/**
        - id: ms-tecnicos
          uri: http://ms-tecnicos:41073
          predicates:
            - Path=/api/tecnicos/**
        - id: ms-solicitudes
          uri: http://ms-solicitudes:41072
          predicates:
            - Path=/api/solicitudes/**

server:
  port: 41071

app:
  keycloak:
    issuer: ${APP_KEYCLOAK_ISSUER:http://keycloak:8080/realms/patito}
    jwk-set-uri: ${APP_KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/patito/protocol/openid-connect/certs}
    audience: ${APP_KEYCLOAK_AUDIENCE:patito-api}
  gateway:
    solicitudes-url: ${APP_GATEWAY_SOLICITUDES_URL:http://ms-solicitudes:41072}
    tecnicos-url: ${APP_GATEWAY_TECNICOS_URL:http://ms-tecnicos:41073}
    clientes-url: ${APP_GATEWAY_CLIENTES_URL:http://ms-clientes:41074}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs