spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/patito
          jwk-set-uri: http://keycloak:8080/realms/patito/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
        - id: ms-clientes
          uri: http://ms-clientes:41074
          predicates:
            - Path=/api/clientes/**
        - id: ms-tecnicos
          uri: http://ms-tecnicos:41073
          predicates:
            - Path=/api/tecnicos/**
        - id: ms-solicitudes
          uri: http://ms-solicitudes:41072
          predicates:
            - Path=/api/solicitudes/**

server:
  port: 41071

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs