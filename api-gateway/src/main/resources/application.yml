server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/patito
          jwk-set-uri: http://localhost:9090/realms/patito/protocol/openid-connect/certs
  application:
    name: api-gateway

app:
  gateway:
    solicitudes-url: http://localhost:8081
    tecnicos-url: http://localhost:8082
    clientes-url: http://localhost:8083