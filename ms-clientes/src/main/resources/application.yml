server:
  port: 41074

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:41090/realms/patito
          jwk-set-uri: http://keycloak:8080/realms/patito/protocol/openid-connect/certs
  application:
    name: ms-clientes
  datasource:
    # Persistencia H2 y ruta donde se guarda
    url: jdbc:h2:file:/app/data/clientes;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # update para no borrar los datos al reiniciar
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
