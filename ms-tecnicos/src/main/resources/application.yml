server:
  port: 8082

spring:
  application:
    name: ms-tecnicos
  datasource:
    url: jdbc:h2:mem:tecnicos;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Regla de Negocio 9: radio máximo de búsqueda de candidatos
app:
  candidatos:
    radio-km: 13.0
