services:
  # ==========================================
  # KEYCLOAK (Identity Provider)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-patito
    ports:
      - "41090:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
      - KC_HOSTNAME_STRICT=false
      - KC_HEALTH_ENABLED=true
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - patito-net
    restart: unless-stopped

  # ==========================================
  # API GATEWAY (Punto de entrada único)
  # ==========================================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "41071:41071"
    environment:
      # URLs internas de los microservicios (nombres de servicio en Docker)
      - APP_GATEWAY_SOLICITUDES_URL=http://ms-solicitudes:41072
      - APP_GATEWAY_TECNICOS_URL=http://ms-tecnicos:41073
      - APP_GATEWAY_CLIENTES_URL=http://ms-clientes:41074
      # Keycloak (puerto interno 8080, no 41090)
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/patito
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/patito/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
      ms-solicitudes:
        condition: service_started
      ms-tecnicos:
        condition: service_started
      ms-clientes:
        condition: service_started
    networks:
      - patito-net
    restart: unless-stopped

  # ==========================================
  # MS-SOLICITUDES
  # ==========================================
  ms-solicitudes:
    build:
      context: .
      dockerfile: ms-solicitudes/Dockerfile
    container_name: ms-solicitudes
    ports:
      - "41072:41072"
    environment:
      - APP_CLIENTES_BASE_URL=http://ms-clientes:41074
      - APP_TECNICOS_BASE_URL=http://ms-tecnicos:41073
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/patito
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/patito/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - patito-net
    restart: unless-stopped

  # ==========================================
  # MS-TECNICOS
  # ==========================================
  ms-tecnicos:
    build:
      context: .
      dockerfile: ms-tecnicos/Dockerfile
    container_name: ms-tecnicos
    ports:
      - "41073:41073"
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/patito
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/patito/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - patito-net
    restart: unless-stopped

  # ==========================================
  # MS-CLIENTES
  # ==========================================
  ms-clientes:
    build:
      context: .
      dockerfile: ms-clientes/Dockerfile
    container_name: ms-clientes
    ports:
      - "41074:41074"
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/patito
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/patito/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - patito-net
    restart: unless-stopped

# ==========================================
# VOLÚMENES Y REDES
# ==========================================
volumes:
  keycloak_data:

networks:
  patito-net:
    driver: bridge