server:
  port: 41072

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/patito}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/patito/protocol/openid-connect/certs}
  application:
    name: ms-solicitudes
  datasource:
    url: jdbc:h2:mem:solicitudes;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  clientes:
    base-url: ${APP_CLIENTES_BASE_URL:http://ms-clientes:41074}
  tecnicos:
    base-url: ${APP_TECNICOS_BASE_URL:http://ms-tecnicos:41073}
  geo:
    base-url: ${GEO_BASE_URL:https://router.project-osrm.org}

tarifas:
  costo-base: 500.0
  costo-por-km: 100.0
  recargo-prioridad:
    BAJA: 0.0
    NORMAL: 0.0
    ALTA: 0.20
    URGENTE: 0.50
  recargo-fuera-de-horario: 0.30
  horario-habil:
    inicio: "08:00"
    fin: "18:00"