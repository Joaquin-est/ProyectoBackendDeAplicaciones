# =========================================================================
# CONFIGURACIÓN DEL MICROSERVICIO DE TÉCNICOS (MS-TECNICOS)
# =========================================================================
server:
  port: 8082 # Puerto para no chocar con el Gateway (8080) o Keycloak (8081)

spring:
  application:
    name: ms-tecnicos

  # Base de datos H2 en memoria
  datasource:
    url: jdbc:h2:mem:tecnicos_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 

  # Habilitar consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuración de JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# Configuración de Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html # Ruta para acceder a la interfaz gráfica
  api-docs:
    path: /v3/api-docs # Ruta donde se expone el JSON de OpenAPI

# Niveles de log
logging:
  level:
    org.hibernate.SQL: DEBUG