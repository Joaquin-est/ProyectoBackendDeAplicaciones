server:
  port: 8080

spring:
  application:
    name: tecnica-patito-api

  # 1. Configuración de H2 (Base de datos en memoria)
  datasource:
    url: jdbc:h2:mem:patito_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  # 2. Habilitar la consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # 3. Configuración de JPA e Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    # Permite ver los datos en la consola H2 antes de que la app se detenga
    defer-datasource-initialization: true

  # 4. Configuración de Keycloak (Resource Server)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/patito-realm

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG